
version: '3.8'

services:
  # 1. Database
  mongo:
    image: mongo:6
    container_name: ymb-mongo
    restart: always
    volumes:
      - mongo_data:/data/db

  # 2. Python API
  backend:
    build: ./backend
    container_name: ymb-backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/bank_app
      - SECRET_KEY=supersecretkey
    depends_on:
      - mongo
    restart: unless-stopped

  # 3. JavaScript API
  transactions:
    build: ./transactions
    container_name: ymb-transactions
    ports:
      - "4000:4000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/bank_app
    depends_on:
      - backend
      - mongo
    restart: unless-stopped

  # 4. Static UI
  frontend:
    build: ./studentportfolio
    container_name: ymb-frontend
    ports:
      - "3000:80"
    environment:
      - API_URL=http://backend:5000
    depends_on:
      - transactions
    restart: unless-stopped

  # 5. Reverse Proxy Gateway
  nginx:
    image: nginx:alpine
    container_name: ymb-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  mongo_data: