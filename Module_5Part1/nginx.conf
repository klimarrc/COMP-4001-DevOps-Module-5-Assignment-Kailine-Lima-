events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 1. New Transactions API (JavaScript)
        # Must be declared BEFORE the general /api/ block
        location /api/transactions/ {
            proxy_pass http://transactions:4000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Banking Backend API (Python)
        location /api/ {
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Static and UI (Frontend Container)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}